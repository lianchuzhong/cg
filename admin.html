<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家管理 · 吃喝玩乐预约</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-logo">📋</span>
      <span class="brand-text">商家<em>管理台</em></span>
    </a>
    <nav class="site-nav">
      <a href="index.html">返回预约页</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app" hidden>

  <div class="admin-bar">
    <h1 style="margin:0;font-size:20px">预约总览</h1>
    <div class="toolbar" style="margin:0">
      <input class="input input-sm" id="q" type="text" placeholder="搜索昵称 / 手机号 / 预约码" maxlength="20">
      <select class="input input-sm" id="fStatus" style="width:130px">
        <option value="">全部状态</option>
        <option value="pending">待确认</option>
        <option value="confirmed">已确认</option>
        <option value="done">已完成</option>
        <option value="canceled">已取消</option>
      </select>
      <select class="input input-sm" id="fItem" style="width:160px"></select>
      <button class="btn btn-sm" id="toJson">保存 JSON 到桌面</button>
      <button class="btn btn-ghost btn-sm" id="toCsv">保存 CSV 到桌面</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer">
        导入 JSON<input type="file" id="imp" accept="application/json,.json" hidden>
      </label>
    </div>
  </div>

  <div class="stat-row" id="stats"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>预约码</th><th>项目</th><th>时间</th><th>人数</th><th>合计</th>
          <th>昵称</th><th>手机号</th><th>备注</th><th>状态</th><th>提交时间</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="empty" id="noData" hidden>暂无数据</p>

  <div class="toolbar" style="margin-top:20px">
    <button class="btn btn-ghost btn-sm" id="reset">清空全部本地数据</button>
    <span class="hint" style="margin:0">数据只存在本机浏览器（localStorage），不会上传到任何仓库。</span>
  </div>

</main>

<div class="lock-box" id="lock" hidden>
  <div style="font-size:42px">🔒</div>
  <h1 style="font-size:19px">商家管理台</h1>
  <p class="hint" style="margin-top:6px">请输入管理口令</p>
  <input class="input" id="pwd" type="password" placeholder="管理口令" style="max-width:280px;margin-top:14px">
  <p class="err" id="lockErr" style="text-align:left;max-width:280px;margin:6px auto 0"></p>
  <button class="btn" id="unlockBtn">进入管理台</button>
  <p class="hint" style="margin-top:18px">
    首次使用：留空口令直接进入，进入后在下方「本地数据」设置口令即可。
  </p>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var toastEl = $("#toast"), t = null;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toast(m, ty) {
    toastEl.textContent = m;
    toastEl.className = "toast" + (ty ? " " + ty : "");
    toastEl.hidden = false;
    clearTimeout(t);
    t = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  /* ---- 简易口令门禁（仅本机演示用） ---- */
  function enter() {
    $("#lock").hidden = true;
    $("#app").hidden = false;
    render();
  }
  function tryUnlock() {
    var need = Store.settings().passcode || "";
    if (!need) return enter();
    if ($("#pwd").value === need) return enter();
    $("#lockErr").textContent = "口令不正确";
  }
  $("#unlockBtn").addEventListener("click", tryUnlock);
  $("#pwd").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });

  /* ---- 项目下拉 ---- */
  (function fillItems() {
    $("#fItem").innerHTML = '<option value="">全部项目</option>' +
      window.ITEMS.map(function (i) {
        return '<option value="' + esc(i.id) + '">' + esc(i.name) + "</option>";
      }).join("");
  })();

  /* ---- 渲染 ---- */
  function currentList() {
    var q = $("#q").value.trim().toLowerCase();
    var st = $("#fStatus").value;
    var it = $("#fItem").value;
    return Store.all().filter(function (b) {
      if (st && b.status !== st) return false;
      if (it && b.itemId !== it) return false;
      if (!q) return true;
      return (b.name || "").toLowerCase().indexOf(q) !== -1 ||
             (b.phone || "").indexOf(q) !== -1 ||
             (b.code || "").toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
  }

  function renderStats(all_) {
    var c = { all: all_.length, pending: 0, confirmed: 0, done: 0, canceled: 0, amount: 0 };
    all_.forEach(function (b) {
      c[b.status] = (c[b.status] || 0) + 1;
      if (b.status !== "canceled") c.amount += b.amount;
    });
    $("#stats").innerHTML =
      '<div class="stat"><b>' + c.all + '</b><span>全部预约</span></div>' +
      '<div class="stat"><b style="color:var(--warn)">' + (c.pending || 0) + '</b><span>待确认</span></div>' +
      '<div class="stat"><b style="color:var(--ok)">' + (c.confirmed || 0) + '</b><span>已确认</span></div>' +
      '<div class="stat"><b style="color:var(--txt-dim)">' + (c.done || 0) + '</b><span>已完成</span></div>' +
      '<div class="stat"><b style="color:var(--danger)">' + (c.canceled || 0) + '</b><span>已取消</span></div>' +
      '<div class="stat"><b style="color:var(--brand-2)">¥' + c.amount + '</b><span>有效营业额</span></div>';
  }

  function render() {
    var list = currentList();
    renderStats(Store.all());
    $("#rows").innerHTML = list.map(function (b) {
      var s = Store.STATUS[b.status] || { label: b.status, cls: "" };
      return "<tr>" +
        "<td>" + esc(b.code) + "</td>" +
        "<td>" + esc((b.itemEmoji || "") + " " + b.itemName) + "</td>" +
        "<td>" + esc(b.date) + " " + esc(b.slot) + "</td>" +
        "<td>" + esc(b.people) + " 人 / " + esc(b.qty) + " 份</td>" +
        "<td>¥" + esc(b.amount) + "</td>" +
        "<td>" + esc(b.name || "-") + "</td>" +
        "<td>" + esc(b.phone || "-") + "</td>" +
        '<td class="note-cell" title="' + esc(b.note || "") + '">' + esc(b.note || "-") + "</td>" +
        '<td><span class="badge ' + s.cls + '">' + esc(s.label) + "</span></td>" +
        "<td>" + esc(Store.fmtDateTime(b.createdAt)) + "</td>" +
        "<td>" + actions(b) + "</td>" +
      "</tr>";
    }).join("");
    $("#noData").hidden = list.length > 0;
  }

  function actions(b) {
    var out = [];
    if (b.status === "pending") out.push('<button class="btn btn-sm" data-confirm="' + b.id + '">确认</button> ');
    if (b.status === "confirmed") out.push('<button class="btn btn-ghost btn-sm" data-done="' + b.id + '">完成</button> ');
    if (b.status !== "canceled" && b.status !== "done") out.push('<button class="btn btn-ghost btn-sm" data-cancel="' + b.id + '">取消</button> ');
    out.push('<button class="danger-link" data-del="' + b.id + '">删除</button>');
    return out.join("");
  }

  document.addEventListener("click", function (e) {
    var el;
    if ((el = e.target.closest("[data-confirm]"))) { Store.setStatus(el.dataset.confirm, "confirmed"); render(); toast("已确认", "ok"); return; }
    if ((el = e.target.closest("[data-done]")))    { Store.setStatus(el.dataset.done, "done");        render(); toast("已标记完成", "ok"); return; }
    if ((el = e.target.closest("[data-cancel]")))  { Store.setStatus(el.dataset.cancel, "canceled");  render(); toast("已取消", "ok"); return; }
    if ((el = e.target.closest("[data-del]"))) {
      if (!confirm("确定删除这条预约？")) return;
      Store.remove(el.dataset.del);
      render();
      toast("已删除", "ok");
    }
  });

  ["#q", "#fStatus", "#fItem"].forEach(function (s) {
    $(s).addEventListener("input", render);
    $(s).addEventListener("change", render);
  });

  /* ---- 导出到桌面（不经过任何网络） ---- */
  function exportTo(msg, fn) {
    var list = currentList();
    if (!list.length) return toast("没有可保存的数据", "err");
    fn(list).then(function (r) {
      toast(r.method === "picker"
        ? "已保存到 " + r.suggested
        : "已下载。若要直接存到桌面，可在浏览器设置中把下载目录改为桌面", "ok");
    }).catch(function () { toast("已取消保存", "err"); });
  }
  $("#toJson").addEventListener("click", function () { exportTo("json", Store.exportJSON); });
  $("#toCsv").addEventListener("click", function () { exportTo("csv", Store.exportCSV); });

  $("#imp").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var n = Store.importJSON(rd.result);
        render();
        toast("导入成功，新增 " + n + " 条", "ok");
      } catch (err) {
        toast("导入失败：" + err.message, "err");
      }
      e.target.value = "";
    };
    rd.readAsText(f, "utf-8");
  });

  $("#reset").addEventListener("click", function () {
    if (!confirm("将清空本机所有预约数据，且无法恢复。确定继续？")) return;
    Store.clearAll();
    render();
    toast("已清空", "ok");
  });

  render();
  if (!Store.settings().passcode) enter();
  else $("#lock").hidden = false;
})();
</script>
</body>
</html>
