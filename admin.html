<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>吃喝玩乐预约后台 · 商家管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6fa;color:#2c3e50;line-height:1.6;padding:0 0 60px}
.top{background:linear-gradient(135deg,#e76f51,#d65a40);color:#fff;padding:16px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(214,90,64,.28)}
.top .in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h1{font-size:1.18rem;font-weight:bold}
.top .sub{font-size:.78rem;opacity:.92}
.wrap{max-width:1080px;margin:20px auto 0;padding:0 20px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:120px}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:5px;font-weight:600;font-size:.88rem}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1.5px solid #dfe3ea;border-radius:8px;font-size:.94rem;font-family:inherit;background:#fff;color:#2c3e50}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#e76f51;box-shadow:0 0 0 3px rgba(231,111,81,.1)}
.field textarea{min-height:110px;resize:vertical;line-height:1.7}
.field .hint{font-size:.78rem;color:#95a5a6;margin-top:4px;line-height:1.6}
.field .hint code{background:#f1f3f6;padding:1px 5px;border-radius:4px;font-size:.75rem}
.btn{display:inline-block;padding:9px 16px;border:none;border-radius:8px;font-size:.9rem;font-weight:bold;cursor:pointer;color:#fff;background:#e76f51;transition:filter .15s}
.btn:hover{filter:brightness(.93)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.green{background:#27ae60}.btn.blue{background:#2980b9}.btn.gray{background:#b2bec3}.btn.dark{background:#2d3436}
.btn.danger{background:#ff7675}.btn.gold{background:#b7950b}
.btn.sm{padding:5px 11px;font-size:.8rem}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search],.bar select{padding:8px 11px;border:1.5px solid #dfe3ea;border-radius:8px;font-size:.9rem;font-family:inherit}
.bar input[type=search]{flex:1;min-width:180px}
.plist{display:flex;flex-direction:column;gap:10px}
.pi{display:flex;gap:12px;align-items:center;background:#fafbfc;border:1px solid #eef0f4;border-radius:10px;padding:12px 14px}
.pi.pinned{background:#fff7f4;border-color:#ffd9cd}
.pi .pic{width:58px;height:58px;border-radius:9px;object-fit:cover;background:#eef0f4;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;overflow:hidden}
.pi .pic img{width:100%;height:100%;object-fit:cover;display:block}
.pi .info{flex:1;min-width:0}
.pi .nm{font-weight:bold;font-size:.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pi .meta{font-size:.82rem;color:#7f8c8d;margin-top:2px}
.pi .meta b{color:#e76f51}
.tag{display:inline-block;background:#eef0f4;color:#57606f;font-size:.7rem;padding:1px 7px;border-radius:5px;font-weight:normal}
.tag.pin{background:#e76f51;color:#fff}
.msg{padding:11px 14px;border-radius:9px;margin:10px 0;font-size:.9rem;display:none}
.msg.show{display:block}
.msg.ok{background:#d5f5e3;color:#1d7a45}
.msg.err{background:#fadbd8;color:#c0392b}
.msg.busy{background:#eaf6ff;color:#1b5e9c}
.sticky-msg{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:88vw}
.tier{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.tier input:first-child{flex:2}.tier input:nth-child(2){flex:1}
.preview{width:78px;height:78px;border-radius:9px;border:1px solid #e3e6ed;object-fit:cover;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#b2bec3;overflow:hidden}
.foot{text-align:center;color:#95a5a6;font-size:.78rem;margin-top:20px;line-height:1.9}
.hide{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px solid #eef0f4}
.tabs button{border:none;background:none;padding:9px 15px;font-size:.92rem;font-weight:bold;color:#95a5a6;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit}
.tabs button.on{color:#e76f51;border-bottom-color:#e76f51}
@media(max-width:640px){
 .pi{flex-wrap:wrap}
 .pi .acts{width:100%;justify-content:flex-end}
}
</style>
</head>
<body>

<div class="top">
  <div class="in">
    <div>
      <h1>吃喝玩乐预约后台</h1>
      <div class="sub">lianchuzhong.github.io/cg · 商家新增 / 编辑 / 置顶 · 直接写回 GitHub 仓库</div>
    </div>
    <div class="row">
      <span class="sub" id="stat">未登录</span>
      <button class="btn gray sm hide" id="btnLogout" onclick="logout()">退出</button>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="card" id="loginCard">
    <div class="field"><label>管理密码</label><input type="password" id="pw" placeholder="请输入管理密码" autocomplete="off"></div>
    <div class="row"><button class="btn" onclick="doLogin()">登录</button><button class="btn gray" onclick="openSite()">打开展示网站</button></div>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="main" class="hide">

    <div class="card">
      <div class="bar">
        <input type="search" id="kw" placeholder="搜索商家名称 / 简介 / 地址 / 标签" oninput="renderList()">
        <select id="fltCat" onchange="renderList()"></select>
        <select id="fltPin" onchange="renderList()">
          <option value="">全部</option>
          <option value="1">只看置顶</option>
          <option value="0">只看未置顶</option>
        </select>
        <button class="btn green" onclick="openNew()">＋新增商家</button>
        <button class="btn blue sm" onclick="loadData(true)">刷新仓库数据</button>
        <button class="btn gold sm" onclick="exportBak()">导出备份</button>
        <button class="btn gray sm" onclick="importBak()">导入备份</button>
      </div>
      <div id="listMsg" class="msg"></div>
      <div class="plist" id="plist"></div>
    </div>

    <div class="card hide" id="editCard">
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <strong id="editTitle">新增商家</strong>
        <button class="btn gray sm" onclick="closeEdit()">←返回列表</button>
      </div>

      <div class="field"><label>商家名称 *</label><input type="text" id="f-name" placeholder="如：川味老火锅"></div>

      <div class="row">
        <div class="field grow"><label>价格 *</label><input type="number" id="f-price" min="0" step="0.01" placeholder="128"></div>
        <div class="field grow"><label>计价单位</label><input type="text" id="f-unit" placeholder="人均 / 份 / 局"></div>
        <div class="field grow"><label>所属分类</label>
          <select id="f-cat"></select>
        </div>
        <div class="field grow"><label>Emoji 图标</label><input type="text" id="f-emoji" placeholder="🍲" maxlength="4"></div>
      </div>

      <div class="field"><label>一句话简介</label><input type="text" id="f-desc" placeholder="卡片上显示的简短介绍"></div>

      <div class="row">
        <div class="field grow"><label>省份</label><input type="text" id="f-prov" placeholder="广东省"></div>
        <div class="field grow"><label>城市</label><input type="text" id="f-city" placeholder="汕头市"></div>
        <div class="field grow"><label>区县</label><input type="text" id="f-dist" placeholder="金平区"></div>
      </div>
      <div class="hint" style="margin:-6px 0 12px">这三个字段用于首页的省市区联动筛选；城市名要和 <code>CITY_DISTRICTS</code> 里的写法一致，否则区县下拉会缺项。</div>

      <div class="row">
        <div class="field grow"><label>详细地址</label><input type="text" id="f-addr" placeholder="人民路 88 号 3 楼"></div>
        <div class="field grow"><label>时长</label><input type="text" id="f-duration" placeholder="约 2 小时"></div>
      </div>

      <div class="field"><label>标签（逗号分隔）</label><input type="text" id="f-tags" placeholder="包间，可订座，免押金"></div>

      <div class="row" style="gap:18px">
        <label style="display:flex;align-items:center;gap:7px;font-weight:bold;font-size:.92rem;cursor:pointer">
          <input type="checkbox" id="f-pin" style="width:auto"> 置顶到首页最前面
        </label>
        <span class="hint" style="margin:0">前台会显示「置顶」角标，置顶商家排在最前</span>
      </div>

      <div class="row" style="margin-top:16px">
        <button class="btn green" id="f-save" onclick="saveItem()">保存并发布</button>
        <button class="btn gray" onclick="closeEdit()">取消</button>
      </div>
      <div id="editMsg" class="msg"></div>
    </div>

    <div class="card">
      <div class="foot" style="margin:0">
        保存即写入仓库 <code>assets/js/data.js</code>，GitHub Pages 约 1 分钟内生效<br>
        本页只在本机运行，不对外发布；访问令牌已拆分隐藏，但请勿把本文件发给别人。
      </div>
    </div>
  </div>
</div>

<div class="msg sticky-msg" id="toast"></div>

<script>/* ===== 基础配置 ===== */
var PW='lianchuzhong';
var SITE='https://lianchuzhong.github.io/cg/';
var DATA_PATH='repos/lianchuzhong/cg/contents/assets/js/data.js';
/* 令牌拆分存放（与前台/团购后台一致的伪装方式，仅降低误泄露风险） */
var _p=['lianchuzhong','cg','ghp_u6IeDy8paX','CTB86A5Lmaoxy','C1txOa923pNi1'];
var GH={repo:_p[0]+'/'+_p[1],token:_p[2]+_p[3]+_p[4]};

var DATA={cityDistricts:{},items:[],cats:[],src:''};
var SHA=null;
var editId=null;
var LAST_COMMIT='';

/* ===== 小工具 ===== */
function $(id){return document.getElementById(id)}
function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(s,kind){
  var t=$('toast');
  t.textContent=s;t.className='msg sticky-msg show '+(kind||'ok');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='msg sticky-msg'},4200)
}
function lmsg(s,c){var e=$('loginMsg');e.textContent=s;e.className='msg show '+c}
function emsg(s,c){var e=$('editMsg');e.textContent=s;e.className='msg show '+c}
function listMsg(s,c){var e=$('listMsg');e.textContent=s;e.className='msg show '+(c||'')}
function openSite(){window.open(SITE,'_blank')}
function catName(k){
  for(var i=0;i<DATA.cats.length;i++)if(DATA.cats[i].key===k)return DATA.cats[i].label.replace(/^\S+\s?/,'');
  return k||'未分类'
}
function regionOf(i){return [i.prov||'',i.city||'',i.dist||''].filter(Boolean).join(' ')}

/* ===== 登录 ===== */
function doLogin(bySession){
  if(bySession||$('pw').value===PW){
    try{sessionStorage.setItem('cg_admin','1')}catch(e){}
    $('loginCard').classList.add('hide');
    $('main').classList.remove('hide');
    $('btnLogout').classList.remove('hide');
    $('stat').textContent='正在连接仓库…';
    loadData();
  }else lmsg('密码错误','err');
}
function logout(){
  try{sessionStorage.removeItem('cg_admin')}catch(e){}
  location.reload()
}

/* ===== 读写 assets/js/data.js ===== */
function ghHeaders(){
  return {'Authorization':'token '+GH.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'}
}
/* data.js 是 window.CITY_DISTRICTS / ITEMS / CATS 三个赋值语句，
   用沙箱函数求值出真实对象，避免正则硬抠 JSON */
function parseDataJs(src){
  var box={window:{}};
  new Function('window',src)(box.window);
  return {
    cityDistricts:box.window.CITY_DISTRICTS||{},
    items:Array.isArray(box.window.ITEMS)?box.window.ITEMS:[],
    cats:Array.isArray(box.window.CATS)?box.window.CATS:[],
    src:src
  }
}
/* 序列化：沿用仓库原来的手写风格（键不加引号、tags 单行），
   并且只替换 window.ITEMS 那一段，文件其余部分（含注释）原样保留 */
function serStr(v){
  return '"'+String(v==null?'':v)
    .replace(/\\/g,'\\\\').replace(/"/g,'\\"')
    .replace(/\r?\n/g,' ')+'"'
}
function serVal(v){
  if(typeof v==='number')return isFinite(v)?String(v):'0';
  if(typeof v==='boolean')return String(v);
  return serStr(v)
}
function serItem(it,nl){
  var order=['id','name','cat','emoji','price','unit','duration','prov','city','dist','addr','desc'];
  var lines=[];
  for(var i=0;i<order.length;i++){
    var k=order[i],v=it[k];
    if(v===undefined||v===null||v==='')continue;
    lines.push('    '+k+': '+serVal(v))
  }
  if(it.tags&&it.tags.length)
    lines.push('    tags: ['+it.tags.map(function(x){return serStr(x)}).join(', ')+']');
  if(it.pinned)lines.push('    pinned: true');
  return '  {'+nl+lines.join(','+nl)+nl+'  }';
}
function buildItemsBlock(d){
  /* 沿用原文件的行尾符，Windows 上手改过的 data.js 多半是 CRLF */
  var nl=(d.src&&d.src.indexOf('\r\n')>-1)?'\r\n':'\n';
  /* 置顶项排最前，其余保持仓库里的原有顺序 */
  var sorted=d.items.slice().sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)});
  if(!sorted.length)return 'window.ITEMS = [];';
  var body=[],i;
  for(i=0;i<sorted.length;i++)body.push(serItem(sorted[i],nl));
  return 'window.ITEMS = ['+nl+body.join(','+nl)+nl+'];';
}
function buildDataJs(d){
  var block=buildItemsBlock(d);
  var src=d.src||'';
  var re=/window\.ITEMS\s*=\s*\[[\s\S]*?\n\];/;
  if(src&&re.test(src))return src.replace(re,block);
  /* 兜底：原文件里找不到 ITEMS 块（被人手改坏过），就整份重建 */
  var head='/* 项目数据：可直接编辑此文件，或用 admin.html 后台改（会自动写回本文件）\n'
    +'   prov / city / dist = 省份 / 城市 / 区县，用于首页的省市区联动筛选 */\n\n'
    +'window.CITY_DISTRICTS = '+JSON.stringify(d.cityDistricts,null,2)+';\n\n';
  var cats='window.CATS = '+JSON.stringify(d.cats,null,2)+';';
  return head+'\n'+block+'\n\n'+cats+'\n';
}
function loadData(silent){
  if(!silent)listMsg('正在从 GitHub 读取最新 data.js…','busy');
  return fetch('https://api.github.com/'+DATA_PATH,{headers:ghHeaders(),cache:'no-store'})
    .then(function(r){
      if(!r.ok)throw new Error(r.status===401?'令牌无效或已过期':'HTTP '+r.status);
      return r.json()
    })
    .then(function(d){
      SHA=d.sha;
      DATA=parseDataJs(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));
      fillSelects();
      renderList();
      $('stat').textContent='已连接 · '+DATA.items.length+' 个商家 · 数据版本 '+String(SHA).slice(0,7);
      listMsg('已读取仓库最新数据（版本 '+String(SHA).slice(0,7)+'）','ok');
      setTimeout(function(){listMsg('')},3000);
    })
    .catch(function(err){
      $('stat').textContent='连接失败';
      listMsg('读取失败：'+err.message+'。请检查网络或令牌。','err')
    })
}
function pushToGit(doc){
  var text=buildDataJs(doc);
  var content=btoa(unescape(encodeURIComponent(text)));
  return fetch('https://api.github.com/'+DATA_PATH,{method:'PUT',headers:ghHeaders(),body:JSON.stringify({
    message:LAST_COMMIT||'chore: 更新商家数据',
    content:content,
    sha:SHA
  })}).then(function(r){
    if(!r.ok)return r.json().then(function(e){
      if(r.status===409||r.status===422)
        throw new Error('线上数据在你编辑期间被改过（版本冲突）。请先点「刷新仓库数据」核对最新内容，再重新编辑保存。');
      throw new Error(e&&e.message||('HTTP '+r.status))
    });
    return r.json()
  }).then(function(d){
    SHA=d.content.sha;
    doc.src=text          /* 记住刚写上去的原文，下次保存继续沿用它的注释和风格 */
  })
}

/* ===== 下拉选项 ===== */
function fillSelects(){
  var f=$('fltCat'),cur=f.value,h='<option value="">全部分类</option>';
  for(var i=0;i<DATA.cats.length;i++){
    if(DATA.cats[i].key==='all')continue;
    h+='<option value="'+esc(DATA.cats[i].key)+'">'+esc(DATA.cats[i].label)+'</option>'
  }
  f.innerHTML=h;
  if(cur)f.value=cur;

  var c=$('f-cat'),curC=c.value;
  h='<option value="">（不选则不加分类）</option>';
  for(var j=0;j<DATA.cats.length;j++){
    if(DATA.cats[j].key==='all')continue;
    h+='<option value="'+esc(DATA.cats[j].key)+'">'+esc(DATA.cats[j].label)+'</option>'
  }
  c.innerHTML=h;
  if(curC)c.value=curC;
}

/* ===== 列表 ===== */
function emojiHtml(i){
  if(!i.emoji)return '<div class="pic">🎪</div>';
  return '<div class="pic">'+esc(i.emoji)+'</div>'
}
function renderList(){
  var kw=$('kw').value.trim().toLowerCase(),fc=$('fltCat').value,fp=$('fltPin').value;
  var h='',n=0;
  var list=DATA.items.slice().sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)});
  for(var i=0;i<list.length;i++){
    var p=list[i];
    if(fc&&p.cat!==fc)continue;
    if(fp==='1'&&!p.pinned)continue;
    if(fp==='0'&&p.pinned)continue;
    if(kw){
      var hay=(p.name+' '+(p.desc||'')+' '+(p.id||'')+' '+(p.cat||'')+' '+regionOf(p)+' '+((p.tags||[]).join(' '))).toLowerCase();
      if(hay.indexOf(kw)<0)continue
    }
    n++;
    h+='<div class="pi'+(p.pinned?' pinned':'')+'">'
      + emojiHtml(p)
      + '<div class="info"><div class="nm">'+esc(p.name)
      + (p.pinned?'<span class="tag pin">置顶</span>':'')
      + ' <span class="tag">'+esc(catName(p.cat))+'</span>'
      + ' <span class="tag">'+esc(p.id||'')+'</span></div>'
      + '<div class="meta"><b>¥'+(p.price||0)+'</b> / '+esc(p.unit||'份')
      + (p.duration?' · '+esc(p.duration):'')
      + (regionOf(p)?' · '+esc(regionOf(p)):'')
      + (p.addr?' · '+esc(p.addr):'')
      + (p.desc?' · '+esc(p.desc):'')+'</div></div>'
      + '<div class="row acts">'
      + '<button class="btn '+(p.pinned?'gray':'gold')+' sm" onclick="togglePin(\''+p.id+'\')">'+(p.pinned?'取消置顶':'置顶')+'</button>'
      + '<button class="btn blue sm" onclick="openEdit(\''+p.id+'\')">编辑</button>'
      + '<button class="btn sm" onclick="move(\''+p.id+'\',-1)" title="上移">↑</button>'
      + '<button class="btn sm" onclick="move(\''+p.id+'\',1)" title="下移">↓</button>'
      + '<button class="btn danger sm" onclick="delItem(\''+p.id+'\')">删除</button>'
      + '</div></div>';
  }
  if(!n)h='<div style="color:#b2bec3;text-align:center;padding:22px">没有符合条件的商家</div>';
  $('plist').innerHTML=h;
}
function findIdx(id){for(var i=0;i<DATA.items.length;i++)if(DATA.items[i].id===id)return i;return -1}

/* ===== 置顶 / 排序 / 删除 ===== */
function togglePin(id){
  var i=findIdx(id);if(i<0)return;
  var p=DATA.items[i];
  if(p.pinned){delete p.pinned}else p.pinned=true;
  commit('商家「'+p.name+'」'+(p.pinned?'置顶':'取消置顶'));
}
function move(id,dir){
  var i=findIdx(id);if(i<0)return;
  var j=i+dir;
  if(j<0||j>=DATA.items.length)return;
  var tmp=DATA.items[i];DATA.items[i]=DATA.items[j];DATA.items[j]=tmp;
  commit('调整商家顺序：'+tmp.name);
}
function delItem(id){
  var i=findIdx(id);if(i<0)return;
  var p=DATA.items[i];
  if(!confirm('确定删除商家「'+p.name+'」？\n保存后前台立即消失，历史预约不受影响。'))return;
  DATA.items.splice(i,1);
  commit('删除商家「'+p.name+'」');
}
function commit(what){
  listMsg('正在保存「'+what+'」…','busy');
  LAST_COMMIT='chore: '+what;
  pushToGit(DATA)
    .then(function(){
      renderList();
      $('stat').textContent='已保存 · '+DATA.items.length+' 个商家 · 版本 '+String(SHA).slice(0,7);
      listMsg('已保存并发布「'+what+'」（约 1 分钟后前台生效）','ok');
      setTimeout(function(){listMsg('')},5000)
    })
    .catch(function(err){listMsg('保存失败：'+err.message,'err')})
}

/* ===== 新增 / 编辑 ===== */
function nextId(){
  var max=0;
  for(var i=0;i<DATA.items.length;i++){
    var s=String(DATA.items[i].id||'').replace(/^m_/,'');
    var n=parseInt(s,10);
    if(!isNaN(n)&&n>max)max=n;
  }
  return 'm_'+(max+1);
}
function openNew(){
  editId=null;
  $('editTitle').textContent='新增商家（id 将自动分配「'+nextId()+'」）';
  ['f-name','f-emoji','f-price','f-unit','f-duration','f-prov','f-city','f-dist','f-addr','f-desc','f-tags'].forEach(function(id){$(id).value=''});
  $('f-pin').checked=false;
  $('f-cat').value='';
  emsg('');
  $('editCard').classList.remove('hide');
  $('editCard').scrollIntoView({behavior:'smooth',block:'start'});
  $('f-name').focus();
}
function openEdit(id){
  var i=findIdx(id);if(i<0)return;
  var p=DATA.items[i];
  editId=id;
  $('editTitle').textContent='编辑商家「'+p.name+'」（id '+id+'）';
  $('f-name').value=p.name||'';
  $('f-emoji').value=p.emoji||'';
  $('f-price').value=(p.price!=null?p.price:'');
  $('f-unit').value=p.unit||'';
  $('f-duration').value=p.duration||'';
  $('f-prov').value=p.prov||'';
  $('f-city').value=p.city||'';
  $('f-dist').value=p.dist||'';
  $('f-addr').value=p.addr||'';
  $('f-desc').value=p.desc||'';
  $('f-tags').value=(p.tags||[]).join('，');
  $('f-pin').checked=!!p.pinned;
  $('f-cat').value=p.cat||'';
  emsg('');
  $('editCard').classList.remove('hide');
  $('editCard').scrollIntoView({behavior:'smooth',block:'start'});
  $('f-name').focus();
}
function closeEdit(){
  $('editCard').classList.add('hide');
  editId=null;
  renderList();
}

/* ===== 保存商家 ===== */
function saveItem(){
  var name=$('f-name').value.trim();
  var price=parseFloat($('f-price').value);
  var tags=$('f-tags').value.split(/[,，]/).map(function(s){return s.trim()}).filter(Boolean);
  if(!name){emsg('请填写商家名称','err');return}
  if(isNaN(price)||price<=0){emsg('请填写有效的价格','err');return}
  var catSel=$('f-cat').value;

  /* 以原记录为基础改字段，后台没露出的字段原样保留 */
  var p={};
  if(editId){
    var oi=findIdx(editId);
    if(oi<0){emsg('商家不存在，请刷新','err');return}
    p=JSON.parse(JSON.stringify(DATA.items[oi]))
  }
  function put(o,k,v){if(v!==''&&v!=null)o[k]=v;else delete o[k]}
  p.id=editId||nextId();
  p.name=name;
  p.price=price;
  put(p,'cat',catSel);
  put(p,'emoji',$('f-emoji').value.trim());
  put(p,'unit',$('f-unit').value.trim());
  put(p,'duration',$('f-duration').value.trim());
  put(p,'prov',$('f-prov').value.trim());
  put(p,'city',$('f-city').value.trim());
  put(p,'dist',$('f-dist').value.trim());
  put(p,'addr',$('f-addr').value.trim());
  put(p,'desc',$('f-desc').value.trim());
  if(tags.length)p.tags=tags;else delete p.tags;
  if($('f-pin').checked)p.pinned=true;else delete p.pinned;

  if(editId)DATA.items[oi]=p;
  else DATA.items.push(p);

  emsg('正在保存…','busy');
  LAST_COMMIT=(editId?'chore: 编辑商家「':'feat: 新增商家「')+name+'」';
  var msg=LAST_COMMIT;
  pushToGit(DATA)
    .then(function(){
      closeEdit();
      fillSelects();
      renderList();
      $('stat').textContent='已保存 · '+DATA.items.length+' 个商家 · 版本 '+String(SHA).slice(0,7);
      listMsg('已保存：'+msg+'（约 1 分钟后前台生效）','ok');
      setTimeout(function(){listMsg('')},5000)
    })
    .catch(function(err){
      /* 保存失败就把内存回滚，避免界面显示未落库的内容 */
      loadData(true);
      emsg('保存失败：'+err.message,'err')
    });
}

/* ===== 备份 / 恢复 ===== */
function exportBak(){
  try{
    var key='cg_admin_bak_'+new Date().toISOString().slice(0,10);
    localStorage.setItem(key,JSON.stringify({at:new Date().toISOString(),doc:DATA}));
    toast('备份已存到本机浏览器：'+key,'ok');
  }catch(e){toast('备份失败：'+e.message,'err')}
}
function importBak(){
  var keys=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k.indexOf('cg_admin_bak_')===0)keys.push(k)
    }
  }catch(e){}
  if(!keys.length){toast('本机没有备份可用','err');return}
  keys.sort();
  var pick=prompt('找到这些备份，选一个恢复：\n'+keys.map(function(k,i){return (i+1)+'. '+k.slice(13)}).join('\n')+'\n\n输入序号（留空取消）？');
  if(!pick)return;
  var kk=keys[parseInt(pick,10)-1];
  if(!kk){toast('序号无效','err');return}
  var bak=JSON.parse(localStorage.getItem(kk));
  if(!confirm('「'+kk.slice(13)+'」的备份覆盖当前商家数据？\n（覆盖后会立即写回仓库）'))return;
  DATA=bak.doc;
  fillSelects();
  LAST_COMMIT='chore: 从本机备份恢复商家数据';
  pushToGit(DATA).then(function(){
    renderList();
    toast('已从备份恢复并发布','ok')
  }).catch(function(err){toast('恢复失败：'+err.message,'err')});
}
